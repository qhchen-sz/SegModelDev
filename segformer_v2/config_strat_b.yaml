# SegFormer v2 背景假阳优化配置 B —— 提高背景曝光 + 背景损失权重
# 针对：v2-fast 在背景图上假阳多于 YOLO（bg_keep_ratio 太低 + focal_alpha 背景权重太低）
project_root: D:/qhchen/NewModel/ADevFolder

train_list: D:/qhchen/NewModel/ADevFolder/train_strat.txt
val_list:   D:/qhchen/NewModel/ADevFolder/val_strat.txt

dataset_dir: D:/qhchen/NewModel/ADevFolder/segformer_v2/dataset_strat_b
out_dir:     D:/qhchen/NewModel/ADevFolder/segformer_v2/runs_strat
val_full_txt: D:/qhchen/NewModel/ADevFolder/segformer_v2/dataset_strat_b/val_full.txt

num_classes: 3
id2label:
  0: background
  1: silie
  2: fanzhe

tile_size: 640
stride: 512
bg_keep_ratio: 0.40          # B 改动①: 0.12 -> 0.40（背景块曝光↑）

loss_focal: 1.0
loss_dice: 1.0
loss_lovasz: 1.0
focal_gamma: 2.0
focal_alpha: [0.80, 2.00, 1.00]   # B 改动②: bg 0.20 -> 0.80（背景抑制↑，缺陷权重不变）

copy_paste_prob: 0.5
silie_crops_dir: D:/qhchen/NewModel/ADevFolder/segformer_v2/silie_crops

model_ckpt: D:/qhchen/NewModel/ADevFolder/segformer_baseline/models/segformer-b1-ade
epochs: 5000
patience: 100
batch_size: 16
lr: 0.00006
weight_decay: 0.01
num_workers: 4
seed: 42
eval_every: 1
resume: true

infer_stride: 320
confidence_threshold: 0.5
tta: true
